name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: shellcheck
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=( **/*.sh )
          [[ ${#files[@]} -eq 0 ]] && { echo "no shell files — skipping"; exit 0; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning "${files[@]}"

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.x"
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}" .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: install-test-deps
        if: ${{ hashFiles('tests/*.bats') != '' }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo /tmp/gitleaks.tar.gz "$url"
          printf '%s  %s\n' "$GITLEAKS_SHA256_LINUX_X64" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          npm install -g lefthook@2.1.6 || sudo npm install -g lefthook@2.1.6
      - name: detect-and-test
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]];then
            echo "::group::node"
            node --version
            (npm ci || npm install) >/dev/null
            npm test --if-present
            echo "::endgroup::"
          elif [[ -f pyproject.toml || -f requirements.txt || -f setup.py ]];then
            echo "::group::python"
            python3 --version
            python3 -m pip install --quiet --upgrade pip
            if [[ -f requirements.txt ]]; then
              python3 -m pip install --quiet -r requirements.txt
            fi
            if [[ -f pyproject.toml ]]; then
              python3 -m pip install --quiet -e . 2>/dev/null || true
            fi
            python3 -m pytest -q 2>/dev/null || echo "no pytest config — skipping"
            echo "::endgroup::"
          elif [[ -f Cargo.toml ]];then
            echo "::group::rust"
            cargo --version
            cargo test --all
            echo "::endgroup::"
          elif [[ -f go.mod ]];then
            echo "::group::go"
            go version
            go test ./...
            echo "::endgroup::"
          else
            echo "no language toolchain detected — running smoke check only"
            ls -la
          fi
      - name: verify-and-lint-scripts
        if: ${{ hashFiles('scripts/verify-workflows.js') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          for f in scripts/*.js scripts/lib/*.js bin/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
