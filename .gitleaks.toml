title = "n8n_showcase gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Deliberately fake secret shapes in lint/sanitize test fixtures."
paths = [
  '''^fixtures/(lint|sanitize)/.*\.json$''',
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  '''(?i)(example|dummy|fake|placeholder|test)[_-]?(api[_-]?key|secret|token|password)''',
  '''(?i)your[_-]?(api[_-]?key|secret|token|password)[_-]?here''',
  '''<REDACTED:[a-z-]+>''',
]
